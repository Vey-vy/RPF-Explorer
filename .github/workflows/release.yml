name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $appVersion = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Release tag v$tagVersion must match tauri.conf.json version $appVersion."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Windows bundler tools
        run: choco install wixtoolset nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Build installers
        run: npm --prefix ui run tauri -- build --bundles msi,nsis

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RPF Explorer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
