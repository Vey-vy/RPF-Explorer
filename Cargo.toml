[package]
name = "rpf-explorer"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:image",
    "dep:image_dds",
    "dep:ddsfile",
    "dep:rpf-archive",
    "dep:rf-formats",
    "dep:sha1",
    "dep:serde_json",
    "dep:rage-formats",
    "dep:rage-render",
]

[dependencies]
aes = "0.8"
base64 = "0.22"
flate2 = "1"
zstd = "0.13"
memmap2 = "0.9"
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"], optional = true }
ddsfile = { version = "0.5", optional = true }
rpf-archive = { version = "0.10", optional = true }
rf-formats = { git = "https://github.com/Simomagy/RedForge.git", rev = "bc3daeafe51a9498a2d39cc9e1f2a7319fa87c6e", optional = true }
sha1 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
rage-formats = { version = "0.5.1", optional = true }
rage-render = { version = "0.5.0", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
